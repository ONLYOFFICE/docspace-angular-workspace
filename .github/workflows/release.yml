name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    env:
      LIB_DIR: projects/onlyoffice/docspace-angular
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org/'
          # Disable automatic dependency caching to reduce cache poisoning risk
          package-manager-cache: false
      - name: Check the tag matches the package version
        run: |
          version="$(node -p "require('./$LIB_DIR/package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests
        run: npm run test:ci
      - name: Build Package
        run: npm run build
      - name: Publish to npm
        working-directory: dist/onlyoffice/docspace-angular
        run: npm publish --provenance --access public
      - name: Extract release notes
        run: |
          awk -v head="## ${GITHUB_REF_NAME#v}" '
            $0 == head { p = 1; next }
            /^## / { p = 0 }
            p
          ' "$LIB_DIR/CHANGELOG.md" > RELEASE.md
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          bodyFile: RELEASE.md
          tag: ${{ github.ref_name }}

name: Create Tag

on:
  push:
    branches: [master]
    paths:
      - 'projects/onlyoffice/docspace-angular/package.json'

permissions:
  contents: write

jobs:
  create-tag:
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get Version
        id: info
        run: echo "version=$(node -p "require('./projects/onlyoffice/docspace-angular/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create Tag
        env:
          TAG: v${{ steps.info.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists"
            exit 0
          fi
          if ! grep -q "^## ${TAG#v}$" projects/onlyoffice/docspace-angular/CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for ${TAG#v}"
            exit 1
          fi
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git tag -a "$TAG" -m "Release/$TAG"
          git push origin "$TAG"

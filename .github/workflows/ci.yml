name: CI

on:
  workflow_dispatch:
  push:
    # Everything left out here cannot change the outcome of a run: docs, the
    # license, the sample environment file and the workflows that do not build
    # or test the package.
    paths-ignore: &ci-paths-ignore
      - '**/*.md'
      - 'LICENSE'
      - '.env.example'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/create-tag.yml'
      - '.github/workflows/licenses.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths-ignore: *ci-paths-ignore

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests
        run: npm run test:ci

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Build Package
        run: npm run build
      - name: Verify Package Entry Points
        run: |
          cd dist/onlyoffice/docspace-angular
          for entry in $(node -p "const p=require('./package.json'); [p.module, p.typings ?? p.types].filter(Boolean).join('\n')"); do
            if [ ! -s "$entry" ]; then
              echo "::error::$entry is missing or empty"
              exit 1
            fi
          done
      - name: Pack Package
        run: |
          cd dist/onlyoffice/docspace-angular
          npm pack

  storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Build Storybook
        run: npm run build-storybook
